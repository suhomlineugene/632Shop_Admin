<div class="file-upload-wrapper d-flex flex-column gap-2">

    <!-- Native file input — hidden, triggered by the button below -->
    <input
        #fileInput
        type="file"
        [multiple]="multiple"
        [accept]="accept"
        style="display: none"
        (change)="onFilesSelected($event)" />

    <!-- Custom PrimeNG button acts as the visible choose trigger -->
    <div>
        <p-button
            type="button"
            [label]="label"
            [icon]="icon"
            severity="secondary"
            (onClick)="chooseFile()">
        </p-button>
    </div>

    <!-- Placeholder when nothing selected -->
    <span *ngIf="selectedFiles.length === 0" class="text-muted small">
        {{ multiple ? 'No files chosen' : 'No file chosen' }}
    </span>

    <!-- Selected file list -->
    <div *ngIf="selectedFiles.length > 0" class="selected-files d-flex flex-column gap-1">
        <div *ngFor="let file of selectedFiles; let i = index"
             class="d-flex align-items-center gap-2 px-2 py-1 border rounded bg-light">
            <i class="pi pi-file text-secondary"></i>
            <span class="fw-semibold small text-truncate" style="max-width: 260px;">{{ file.dto.fileName }}</span>
            <span class="text-muted small ms-auto me-2">{{ formatSize(file.size) }}</span>
            <button type="button" class="btn btn-link btn-sm p-0 text-danger" (click)="removeFile(i)" title="Remove">
                <i class="fa-solid fa-trash-can delete-button"></i>
            </button>
        </div>
    </div>

</div>
